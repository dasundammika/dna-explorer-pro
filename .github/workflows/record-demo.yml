name: Record live DNA Explorer Pro demo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-demo.yml'
      - 'scripts/record-demo.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        run: npm install -g bun@1.4.4
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Build app for local browser preview
        env:
          VITE_BASE_PATH: /dna-explorer-pro/
        run: bun run build
      - name: Add Playwright automation
        run: bun add --dev playwright@1.56.1
      - name: Install FFmpeg
        run: apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null
      - name: Start local app server
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/dna-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/dna-explorer-pro/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dna-preview.log
          exit 1
      - name: Record real browser interactions
        run: node scripts/record-demo.mjs
      - name: Encode X-ready MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -i recordings/app-recording.webm \
            -vf "fps=25,scale=1280:720:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p \
            -movflags +faststart -an media/dna-explorer-demo.mp4
          ls -lh media/dna-explorer-demo.mp4
      - name: Upload downloadable video artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNA-Explorer-Pro-Real-Application-Demo
          path: |
            media/dna-explorer-demo.mp4
            media/dna-explorer-demo-frame.png
      - name: Publish video to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/dna-explorer-demo.mp4 media/dna-explorer-demo-frame.png
          git commit -m "Add real-browser DNA Explorer Pro demo [skip ci]"
          git push
